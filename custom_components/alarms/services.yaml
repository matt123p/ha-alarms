stop:
  name: Stop Alarm
  description: Stop/dismiss a targeted alarm, or all currently ringing or snoozed alarms when no target is supplied.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID (UUID) of the alarm to stop.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Any entity belonging to the alarm to stop (e.g. switch.morning_wakeup_enabled).
      required: false
      selector:
        entity:
          domain: switch

dismiss:
  name: Dismiss Alarm
  description: Stop/dismiss a targeted alarm, or all currently ringing or snoozed alarms when no target is supplied (alias of stop).
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID (UUID) of the alarm to dismiss.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Any entity belonging to the alarm to dismiss.
      required: false
      selector:
        entity:
          domain: switch

snooze:
  name: Snooze Alarm
  description: Snooze a targeted alarm, or all currently ringing alarms when no target is supplied.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID (UUID) of the alarm to snooze.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Any entity belonging to the alarm to snooze.
      required: false
      selector:
        entity:
          domain: switch
    duration:
      name: Duration
      description: Optional override snooze duration in minutes.
      required: false
      selector:
        number:
          min: 1
          max: 60

skip_next:
  name: Skip Next
  description: Skip the next upcoming trigger of a repeating alarm.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID (UUID) of the alarm.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Any entity belonging to the alarm.
      required: false
      selector:
        entity:
          domain: switch

unskip_next:
  name: Unskip Next
  description: Cancel a skip-next action on a repeating alarm.
  fields:
    alarm_id:
      name: Alarm ID
      description: The unique ID (UUID) of the alarm.
      required: false
      selector:
        text:
    entity_id:
      name: Entity ID
      description: Any entity belonging to the alarm.
      required: false
      selector:
        entity:
          domain: switch
